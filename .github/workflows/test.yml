name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} ${{ matrix.cryptography }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
        cryptography: [""]
        include:
          # The oldest cryptography the package says it works with (pyproject.toml).
          - os: ubuntu-latest
            python: "3.10"
            cryptography: "42.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Install the oldest supported cryptography
        if: matrix.cryptography != ''
        shell: bash
        env:
          CRYPTOGRAPHY_VERSION: ${{ matrix.cryptography }}
        run: python -m pip install "cryptography==$CRYPTOGRAPHY_VERSION"
      - name: Test
        working-directory: tests
        run: python ../tools/run_tests.py
